{{- $p := hugo.Data.profile }}
{{- $home := cond .IsHome "" "/" }}
<a class="skip" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap header-inner">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">kw</span>
      <span class="brand-name">{{ $p.name }}</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="{{ $home }}#courses">Courses</a>
      <a href="{{ $home }}#projects">Projects</a>
      <a href="{{ $home }}#opensource">Open source</a>
      <a href="{{ $home }}#talks">Talks</a>
      <a href="{{ $home }}#games">Games</a>
      <a href="{{ $home }}#experience">Experience</a>
      <a href="/archive/">Archive</a>
      <a class="nav-cta" href="{{ $home }}#contact">Contact</a>
      <button class="theme-toggle" type="button" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></g></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1Z"/></svg>
      </button>
    </nav>
  </div>
</header>
