intro: >-
  Before Chainguard I spent four years building and maintaining research
  software at the Alan Turing Institute: open-source Python tools, their
  documentation, and the communities around them.

# color: violet | coral | teal | sun | sky
# docs: documentation site. site: project website. repo: GitHub.
software:
  - name: MapReader
    color: teal
    summary: >-
      A computer vision pipeline for exploring and analysing large collections
      of digitised maps. Winner of the 2023 Roy Rosenzweig Prize for Innovation
      in Digital History.
    role: Documentation and community
    commits: 95
    repo: https://github.com/maps-as-data/MapReader
    docs: https://mapreader.readthedocs.io/en/latest/

  - name: AutoEmulate
    color: sky
    summary: >-
      A Python package for semi-automated emulation of complex simulations,
      built for digital twin research.
    role: Contributor
    commits: 49
    repo: https://github.com/alan-turing-institute/autoemulate

  - name: TEA Platform
    color: violet
    summary: >-
      The Trustworthy and Ethical Assurance platform, a collaborative tool for
      building structured arguments that an AI system was developed
      responsibly.
    role: Contributor
    commits: 83
    repo: https://github.com/alan-turing-institute/AssurancePlatform
    site: https://assuranceplatform.turing.ac.uk/

