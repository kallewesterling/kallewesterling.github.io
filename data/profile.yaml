fullBio: >-
  Kalle Westerling is a Staff Developer Relations Engineer at Chainguard, where
  he creates courses, hands-on labs, workshops and live demos that help
  developers adopt secure container images and open-source libraries. He also
  builds open-source tools for developer educators, from testing code examples
  in published courses to pacing live sessions. Before Chainguard he was a
  research software engineer and research application manager at the Alan
  Turing Institute, and before that he led national coding and research
  training programs at CUNY, where he earned a PhD in digital humanities. He
  still approaches technical education as a teacher first.
