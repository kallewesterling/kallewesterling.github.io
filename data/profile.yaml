intro: >-
  I teach developers how to ship secure software, and I build the tools that
  make that teaching hold up. At Chainguard I create courses, hands-on labs,
  workshops and live demos on container images, open-source libraries and
  software supply chain security.

intro2: >-
  I came to developer relations by way of the classroom and the research lab: a
  PhD in digital humanities, coding curricula for faculty across the
  United States, and research software at the Alan Turing Institute. I still
  design learning the same way: start from where people get stuck, and remove
  that step.

